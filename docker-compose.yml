services:
  ez-db:
    image: postgres:16
    container_name: ez-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ezuser
      POSTGRES_PASSWORD: ezpass
      POSTGRES_DB: ezapply_dev
    ports:
      - "5432:5432"
    volumes:
      - ez-db-data:/var/lib/postgresql/data

  automation-queue:
    image: redis:7-alpine
    container_name: ez-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ez-redis-data:/data

volumes:
  ez-db-data:
  ez-redis-data:
